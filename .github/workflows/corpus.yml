# The tests `npm run check` cannot reach: 167 of them at 0.6.314, from 116 when this was written.
#
# `tests/corpus/` compares edfcore against bytes real hardware and real software produced —
# EDFlib's generator, a PhysioNet polysomnogram, a CHB-MIT scalp EEG recording — including the
# parity goldens generated from pyEDFlib and MNE. Every one of them skips when
# `tests/corpus/files/` is empty, which is the right default: a plain `git clone && npm test`
# must not reach the network, and the files are gitignored because one of them is a real
# person's overnight recording that must never be committed or published.
#
# The consequence was that they ran nowhere. `ci.yml` never fetches, `scripts/release.mjs` runs
# `npm run check`, and neither downloads anything — so the suite that exists to check this
# library against the real world executed only when a developer happened to have run
# `corpus:fetch` on their own machine. 0.4.219 worked around it by ungating one check; this
# gives the other 116 somewhere to run.
#
# Weekly rather than per-push, and cached on the manifest hash, because the files come from
# third-party servers that owe this project nothing. A run that hits the cache downloads
# nothing at all. Nothing here gates a merge: a corpus host being down is not a broken library,
# and a red cross on a scheduled job is the honest way to say so.
name: Corpus

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Keyed on the manifest, which carries every URL and every hash: a file added, removed or
      # re-pointed changes the key and the next run fetches. `fetch-corpus.mjs` verifies each
      # file against its sha256 either way, so a restored cache is checked, not trusted.
      #
      # v6, not v4, and it was the only action here not on its current major. v4 targets the Node 20
      # runtime, which GitHub has deprecated and is currently FORCING onto Node 24 — every run of
      # this job printed "Node.js 20 is deprecated... being forced to run on Node.js 24" — so it
      # works until the forcing stops. v5.0.0 is exactly that fix upstream ("Upgrade to use node24")
      # and v6.0.0 changes only internals; `path` and `key` are the inputs this uses and neither
      # major touched them.
      #
      # It is the cache step, so a break here would not be loud: the fetch below still runs and the
      # job still passes, just downloading ~102 MB from third-party servers every week instead of
      # restoring. 0.6.303 is about the other way this job stopped reporting what it was built to
      # report.
      - uses: actions/cache@v6
        with:
          path: tests/corpus/files
          key: corpus-${{ hashFiles('tests/corpus/manifest.json') }}
      - run: npm run corpus:fetch
      # BEFORE the suite, because `npm test` alone is not `npm run check`.
      #
      # `packaging-claims.test.ts` reads the export targets out of `package.json` and asserts each
      # one exists in `dist/`, and `ci.yml` satisfies it two different ways — `npm run check` for
      # the main job, an explicit `npm run build` for the package and site jobs. This job ran
      # `npm test` on a tree that had never been built, so those seven assertions failed on every
      # run and the job was red for a reason that has nothing to do with the corpus.
      #
      # That is what made it worth fixing rather than tolerating. The header above says "a corpus
      # host being down is not a broken library, and a red cross on a scheduled job is the honest
      # way to say so" — so the cross IS the signal, and a permanent one carries nothing. A real
      # outage had been invisible here for weeks.
      - run: npm run build
      # The whole suite, not the corpus directory alone: several files outside it read a corpus
      # file when one is there, and the point is the run that has them.
      - run: npm test
