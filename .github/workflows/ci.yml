name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.12 is the declared floor — the version where require(esm) became unflagged,
        # which is what makes shipping ESM-only safe for CommonJS consumers.
        node: ['22.12', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Lint, typecheck and test
        run: npm run check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The site imports edfcore from the parent package, so the library builds first.
      - run: npm run build
      - run: npm --prefix website ci
      - run: npm --prefix website run build
