name: Publish to npm

# A pushed TAG publishes, not a published GitHub release.
#
# Those were the same thing until 0.4.326, and coupling them made a GitHub Release a mandatory step
# in shipping a patch version rather than an announcement: every version needed one, so a hundred
# of them accumulated for changes of two or three lines each. A tag is the per-version record and
# `scripts/announce-batch.mjs` cuts one Release for a whole batch afterwards, which is what a
# Release is for.
#
# The gate did not move with it. `scripts/release.mjs` pushes main, waits for CI to go green on
# that exact commit, and only then pushes the tag — so nothing reaches this workflow that the
# runners have not already agreed with. That ordering is stricter than the old one: a red commit
# now leaves the tag unpushed and the version number still free, where before the tag was already
# public and the number was spent.
on:
  push:
    tags: ['v*']
  # Re-runnable against a tag that is already public, which is the only recovery there is once a
  # version number has been spent: `gh workflow run publish.yml --ref v0.4.326`.
  workflow_dispatch:

permissions:
  contents: read
  # Required for the provenance attestation on the publish step below, which signs the tarball
  # with this short-lived OIDC token. NOT for trusted publishing: registering that returns 400
  # against this package, so the publish authenticates with the NPM_TOKEN secret instead — see
  # the note on that step.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache on a release build: the tarball that goes to the registry
          # should come from a clean resolve, not from whatever a previous run left behind.

      # Pinned for publish-side fixes and a predictable npm, whatever the runner's Node bundled.
      # This was originally here because trusted publishing needs npm >= 11.5.1; that is not how
      # this workflow authenticates — see the note on the publish step.
      - run: npm install -g npm@latest

      - run: npm ci

      # Never publish something that does not pass. The package has no install-time scripts,
      # so this is the only gate there is.
      - name: Lint, typecheck and test
        run: npm run check

      - run: npm run build

      # The same script CI runs on every push, so a packaging regression is a red pull request
      # rather than something found here — after the tag is pushed, where the only way forward is
      # to fix it in the next version. Defined once in package.json so the two cannot drift.
      - name: Verify the published shape
        run: npm run verify:package

      # --provenance lives here rather than in publishConfig on purpose. In publishConfig it
      # applies to every publish, including one run by hand, and a laptop has no OIDC token to
      # sign with — so an ordinary `npm publish` fails with no useful explanation. Keeping the
      # flag on the CI step means provenance is attested when CI publishes, and publishing by
      # hand still works.
      #
      # Authentication is by granular access token, supplied as the NPM_TOKEN repository secret.
      # `actions/setup-node` with `registry-url` writes an .npmrc that reads NODE_AUTH_TOKEN, so
      # setting the variable here is all that is needed. Provenance is independent of how the
      # publish authenticates — it comes from `id-token: write` above — so the attestation is
      # still produced on a token publish.
      #
      # The token must be created with "bypass 2FA" enabled, because the package's publishing
      # access is set to "require two-factor authentication OR a granular access token with
      # bypass 2FA enabled". A granular token without that flag is refused like any other
      # unauthenticated publish.
      #
      # Trusted publishing (`npm trust github …`) would remove the secret entirely and is the
      # better end state, but registering it returns 400 against this package — OIDC is a third
      # path that the access setting above does not sanction. Revisit if that setting changes.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
