name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm trusted publishing. npm exchanges this short-lived OIDC token for
  # publish rights, so no long-lived secret is stored anywhere, and provenance is attested
  # automatically. Classic npm tokens were revoked at the end of 2025, so this is now the
  # normal path rather than the advanced one.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache on a release build: the tarball that goes to the registry
          # should come from a clean resolve, not from whatever a previous run left behind.

      # Trusted publishing needs npm >= 11.5.1, and the version bundled with Node is not
      # guaranteed to be above that. Pinning to latest also picks up publish-side fixes.
      - run: npm install -g npm@latest

      - run: npm ci

      # Never publish something that does not pass. The package has no install-time scripts,
      # so this is the only gate there is.
      - name: Lint, typecheck and test
        run: npm run check

      - run: npm run build

      - name: Verify the published shape
        run: |
          npx --yes publint@latest --strict
          npx --yes @arethetypeswrong/cli@latest --pack . --profile esm-only

      # --provenance lives here rather than in publishConfig on purpose. In publishConfig it
      # applies to every publish, including one run by hand, and a laptop has no OIDC token to
      # sign with — so an ordinary `npm publish` fails with no useful explanation. Keeping the
      # flag on the CI step means provenance is attested when CI publishes, and publishing by
      # hand still works.
      #
      # Authentication is by granular access token, supplied as the NPM_TOKEN repository secret.
      # `actions/setup-node` with `registry-url` writes an .npmrc that reads NODE_AUTH_TOKEN, so
      # setting the variable here is all that is needed. Provenance is independent of how the
      # publish authenticates — it comes from `id-token: write` above — so the attestation is
      # still produced on a token publish.
      #
      # The token must be created with "bypass 2FA" enabled, because the package's publishing
      # access is set to "require two-factor authentication OR a granular access token with
      # bypass 2FA enabled". A granular token without that flag is refused like any other
      # unauthenticated publish.
      #
      # Trusted publishing (`npm trust github …`) would remove the secret entirely and is the
      # better end state, but registering it returns 400 against this package — OIDC is a third
      # path that the access setting above does not sanction. Revisit if that setting changes.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
